[package]
name = "daylog"
version = "0.1.0"
description = "Окно для просмотра дней daylog и управления сборщиком"
edition = "2021"

[lib]
name = "daylog_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
